[package]
name = "simulator"
version = "0.1.0"
edition = "2024"

[dependencies]
shared-types = { path = "../shared-types" }
config = { path = "../config" }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", features = ["ring"] }
serde_json = "1"
futures-util = "0.3"
url = "2"
